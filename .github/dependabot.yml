version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: prod
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
    # Published ranges (dependencies, peerDependencies) change only by hand.
    allow:
      - dependency-type: development
    groups:
      non-major:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
