name: Documentation checks

on:
  pull_request:
    paths:
      - 'README.md'
      - 'context7.json'
      - 'docs-tests/**'
      - '.github/workflows/docs-check.yml'
  push:
    branches: [prod]
    paths:
      - 'README.md'
      - 'context7.json'
      - 'docs-tests/**'
      - '.github/workflows/docs-check.yml'

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --legacy-peer-deps
        working-directory: docs-tests
      - run: npm test
        working-directory: docs-tests
